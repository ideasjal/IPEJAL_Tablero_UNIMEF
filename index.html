<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablero IPEJAL</title>
    
    <!-- Configuración para PWA / Celulares -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7357C1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IPEJAL Tablero">

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Tipografía Garet con fallback a Poppins */
        @font-face {
            font-family: 'Garet';
            src: local('Garet'), url('Garet-Book.woff2') format('woff2');
            font-display: swap;
        }

        :root {
            --pantone-151c: #FF8300;
            --pantone-2665c: #7357C1;
            --bg-powerbi: #EEF2F3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-powerbi);
            font-family: 'Garet', 'Poppins', sans-serif;
        }

        /* Pantalla de Carga (Splash Screen) - Animación de 2 segundos */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease-in-out 2s forwards;
        }

        .logo-container {
            width: 80%;
            max-width: 320px;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .logo-container img {
            width: 100%;
            height: auto;
        }

        .loader-bar {
            width: 180px;
            height: 4px;
            background-color: #E0E0E0;
            border-radius: 2px;
            margin-top: 25px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--pantone-151c), var(--pantone-2665c));
            animation: fillProgress 2s ease-in-out forwards;
        }

        /* Header Superior */
        header {
            height: 50px;
            background-color: #FFFFFF;
            border-bottom: 2px solid var(--pantone-151c);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 1rem;
            color: var(--pantone-2665c);
            font-weight: 600;
        }

        /* Contenedor del Tablero PowerBI Responsive */
        .dashboard-container {
            width: 100%;
            height: calc(100vh - 50px);
            background-color: var(--bg-powerbi);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: var(--bg-powerbi);
        }

        /* Animaciones CSS */
        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <!-- Animación de Bienvenida (2 segundos) -->
    <div id="splash-screen">
        <div class="logo-container">
            <!-- Coloca aquí el archivo de la imagen del logo -->
            <img src="logo_ipejal.png" alt="IPEJAL - Instituto de Pensiones del Estado de Jalisco">
        </div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- Barra de Encabezado -->
    <header>
        <h1>Tablero IPEJAL</h1>
    </header>

    <!-- Visualización del Reporte de Power BI -->
    <main class="dashboard-container">
        <iframe 
            title="IPEJAL_Tablero" 
            src="https://app.powerbi.com/reportEmbed?reportId=16f1be6e-dc00-4cf1-bb4f-813cec890eb9&autoAuth=true&ctid=cc1499d3-daba-4b7d-b74d-0047a698bc1c" 
            allowFullScreen="true">
        </iframe>
    </main>

    <script>
        // Registrar el Service Worker para habilitar comportamiento PWA (App Móvil)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado correctamente'))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
