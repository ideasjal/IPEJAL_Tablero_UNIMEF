<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPEJAL_Tablero</title>
  
  <!-- Configuración PWA para móviles -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IPEJAL">
  <meta name="theme-color" content="#ffffff">

  <!-- Iconos de la pestaña y app -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ideasjal/IPEJAL_Tablero_UNIMEF/main/logo-ipejal_st.png">
  <link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/ideasjal/IPEJAL_Tablero_UNIMEF/main/logo-ipejal_st.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ideasjal/IPEJAL_Tablero_UNIMEF/main/logo-ipejal_st.png">
  <link rel="manifest" href="./manifest.json">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Pantalla de carga (Loader) */
    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader-wrapper img {
      max-width: 200px;
      height: auto;
      margin-bottom: 25px;
    }

    .progress-bar-container {
      width: 180px;
      height: 5px;
      background-color: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background-color: #5b3a9c;
      animation: loading 2s ease-in-out infinite;
      transform-origin: left;
    }

    @keyframes loading {
      0% { transform: scaleX(0); }
      50% { transform: scaleX(0.7); }
      100% { transform: scaleX(1); }
    }

    /* Marco del reporte */
    #pbi-iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }

    .fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Animación de Carga -->
  <div id="loader-wrapper">
    <img src="https://raw.githubusercontent.com/ideasjal/IPEJAL_Tablero_UNIMEF/main/logo-ipejal1.png" alt="IPEJAL">
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
  </div>

  <!-- Contenedor del Reporte Power BI -->
  <iframe 
    id="pbi-iframe"
    title="IPEJAL_Tablero" 
    src="https://app.powerbi.com/view?r=eyJrIjoiNzk3OWUyNzUtYjVkMi00MjJkLTg0YmYtMDEzZTVhZTU3ZDZmIiwidCI6ImNjMTQ5OWQzLWRhYmEtNGI3ZC1iNzRkLTAwNDdhNjk4YmMxYyIsImMiOjR9" 
    allowFullScreen="true">
  </iframe>

  <script>
    const loader = document.getElementById('loader-wrapper');
    const iframe = document.getElementById('pbi-iframe');

    function ocultarLoader() {
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
      }
    }

    // Ocultar loader cuando el iframe responda
    iframe.onload = function() {
      setTimeout(ocultarLoader, 1000);
    };

    // Temporizador de respaldo: fuerza la aparición del contenido tras 3 segundos incluso si Power BI falla
    setTimeout(ocultarLoader, 3000);
  </script>

</body>
</html>
